[theme]
base = "light"
primaryColor = "#b3121b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2f0"
textColor = "#1c1b1a"
linkColor = "#b3121b"
borderColor = "#dcdad6"
baseRadius = "small"
baseFontSize = 17
font = "Atkinson Hyperlegible:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
